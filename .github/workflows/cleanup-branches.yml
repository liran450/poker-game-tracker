name: Cleanup stale branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale claude/* branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'claude/poker-plan-implementation-jhigx7',
              'claude/project-build-plan-hv2vzu',
              'claude/branch-cleanup-workflow-5ytdjk',
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                console.log(`Deleted: ${branch}`);
              } catch (err) {
                console.log(`Skipped ${branch}: ${err.message}`);
              }
            }
