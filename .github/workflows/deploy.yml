name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the deploy needs these; the verify job runs with the default read scope.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck → lint → lint:css → test → audit:prod → build.
      # Nothing is marked done in docs/build/PROGRESS.md until this is green.
      #
      # Deliberately NO Supabase secrets on this step: `test` runs inside this same `verify`
      # chain, and vitest (like vite) reads `import.meta.env` straight from `process.env` — a
      # real project's credentials here would mean the unit suite itself instantiates a real
      # `supabase-js` client and can reach out to it, which is exactly what happened once (a
      # test asserting "throws when unconfigured" instead called the real Google OAuth/realtime
      # endpoint and crashed on a stray websocket event — see docs/build/NOTES.md). Verifying
      # still needs to prove the app *builds* without them, which this build step already does.
      - run: npm run verify

      - name: End-to-end smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # A second, production build — main only, right before the deploy artifact is taken —
      # is the one and only place these secrets are used. Mapped to the VITE_ prefix Vite embeds
      # at build time (docs/build/PROGRESS.md step 1's "connect-src is 'self' only until
      # VITE_SUPABASE_URL is set" watch-out). Empty on a fork PR (no access to repo secrets) —
      # supabaseClient.ts already treats that as "cloud unavailable", never throws, so this
      # step never runs there anyway (it's gated to `main`, which forks never push to).
      - name: Production build with real Supabase config
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rebuilds the schema from supabase/migrations against a bare Postgres service
      # container (no Supabase CLI/Docker-in-Docker needed — see docs/build/NOTES.md for why),
      # then asserts: RLS is enabled on every table (and that check has teeth), a non-host
      # cannot write, someone not in the game cannot take over host, every rejection is the
      # same generic shape, and the game_event_type enum matches core/events.ts exactly.
      - name: Schema, RLS and event-enum-parity tests
        env:
          SUPABASE_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run test:db

  deploy:
    needs: [verify, db-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
